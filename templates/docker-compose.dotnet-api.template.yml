# ==============================================================================
# 🧩 TEMPLATE: .NET CORE BACKEND API SERVICE
# ==============================================================================
# Variables to substitute:
# - {{SERVICE_NAME}}: Container & service slug (e.g. acme-api-prod)
# - {{SERVICE_HOST}}: Traefik public hostname (e.g. api.acme.com)
# - {{CONTAINER_PORT}}: Target application container port (e.g. 8080)
# - {{ENV_NAME}}: dev | uat | prod
# - {{DB_NAME}}: Dedicated database name (e.g. acme_api_prod)
# ==============================================================================

services:
  {{SERVICE_NAME}}:
    image: {{IMAGE_TAG}}
    container_name: {{SERVICE_NAME}}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:{{CONTAINER_PORT}}
      - ConnectionStrings__DefaultConnection=Host=shared_postgres;Port=5432;Database={{DB_NAME}};Username=postgres;Password=StrongPostgres@123;Pooling=true;MaxPoolSize=20;
    volumes:
      - /var/www/vps-infra/volumes/apps/{{SERVICE_SLUG}}/{{ENV_NAME}}/uploads:/app/wwwroot/uploads
      - /var/www/vps-infra/volumes/apps/{{SERVICE_SLUG}}/{{ENV_NAME}}/logs:/app/logs
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      # HTTP Router (ACME Challenge)
      - "traefik.http.routers.{{SERVICE_NAME}}-http.rule=Host(`{{SERVICE_HOST}}`)"
      - "traefik.http.routers.{{SERVICE_NAME}}-http.entrypoints=web"
      
      # HTTPS Router
      - "traefik.http.routers.{{SERVICE_NAME}}.rule=Host(`{{SERVICE_HOST}}`)"
      - "traefik.http.routers.{{SERVICE_NAME}}.entrypoints=websecure"
      - "traefik.http.routers.{{SERVICE_NAME}}.tls=true"
      - "traefik.http.routers.{{SERVICE_NAME}}.tls.certresolver=myresolver"
      - "traefik.http.services.{{SERVICE_NAME}}.loadbalancer.server.port={{CONTAINER_PORT}}"

networks:
  traefik_net:
    external: true
